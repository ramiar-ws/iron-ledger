<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0A0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Block-periodised workout logger.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>html{background:#0A0A0B}body{margin:0}img{max-width:100%}
[hidden]{display:none!important}</style>
<title>Iron Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* OpenDyslexic (SIL OFL 1.1) — see fonts/OFL.txt. Weighted bottoms and
   wider spacing; some readers strongly prefer it. Off by default. */
@font-face{
  font-family:"OpenDyslexic";
  src:url("fonts/OpenDyslexic-Regular.woff2") format("woff2");
  font-weight:400 600;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"OpenDyslexic";
  src:url("fonts/OpenDyslexic-Bold.woff2") format("woff2");
  font-weight:700 900;font-style:normal;font-display:swap;
}

/* ============================================================
   TOKENS — light is the base; dark redefines tokens only.
   Neutrals carry a slight cyan bias toward the accent.
   ============================================================ */
:root{
  /* Committed dark world. A gym app under bad lighting has one job:
     make the number you need the brightest thing on the glass. */
  --bg:#0A0A0B;
  --surface:#141416;
  --surface-2:#1C1C20;
  --surface-3:#2A2A30;
  --line:#2F2F37;
  --line-soft:#1F1F25;

  --text:#F7F7F3;
  --text-dim:#9B9BA3;
  --text-faint:#67676F;

  /* yellow = signal, progress, "you hit it" */
  --accent:#FFE23D;
  --accent-ink:#0A0A0B;
  --accent-soft:#2B2708;

  /* pink = attention, hold, back off */
  --pink:#FF4F93;
  --pink-ink:#0A0A0B;
  --pink-soft:#300F1D;

  --hit:#FFE23D;
  --hit-soft:#2B2708;
  --warn:#FF4F93;
  --warn-soft:#300F1D;
  --miss:#FF4F93;
  --miss-soft:#300F1D;

  --ph-strength:#FFE23D;
  --ph-hyper:#FF4F93;
  --ph-deload:#F7F7F3;

  --shadow:0 1px 2px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.4);
  --shadow-lift:0 2px 8px rgba(0,0,0,.6), 0 16px 40px rgba(0,0,0,.5);

  --r-s:8px; --r-m:12px; --r-l:18px;
  --nav-h:62px;

  --f-display:"Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}

/* OpenDyslexic runs large and wide for its point size, so ease the
   tracking and tighten headline sizes to stop rows wrapping. */
:root[data-font="dyslexic"]{
  --f-display:"OpenDyslexic", "Archivo", ui-sans-serif, system-ui, sans-serif;
}
:root[data-font="dyslexic"] body{letter-spacing:-.01em}
:root[data-font="dyslexic"] .topbar h1{font-size:23px}
:root[data-font="dyslexic"] .today-hero h2{font-size:27px;letter-spacing:-.02em}
:root[data-font="dyslexic"] .ex-head .nm{font-size:14px}
:root[data-font="dyslexic"] .plan-row .nm{font-size:13px}
:root[data-font="dyslexic"] .fcard h3{font-size:15px}
:root[data-font="dyslexic"] .eyebrow,
:root[data-font="dyslexic"] .sec-title,
:root[data-font="dyslexic"] .pill,
:root[data-font="dyslexic"] .tab{letter-spacing:.06em}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--f-display);
  font-size:15px;
  line-height:1.45;
  margin:0;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ============================================================
   SHELL
   ============================================================ */
#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  position:relative;
}
#view{
  padding:0 14px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 26px);
}
body.in-session #view{ padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 20px); }
.topbar{
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top, 0px) + 18px) 0 14px;
}
.topbar h1{
  font-size:26px;font-weight:900;letter-spacing:-.025em;margin:0;line-height:1;
}
.eyebrow{
  font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-faint);margin:0 0 5px;
}

/* bottom nav */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);
  height:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px);
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
#tabs > div{max-width:560px;margin:0 auto;width:100%;display:contents}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-faint);font-size:10px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;padding-top:6px;transition:color .15s;
}
.tab svg{width:21px;height:21px;stroke-width:1.9}
.tab[aria-current="true"]{color:var(--accent)}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.card{
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--r-l);
  padding:16px;
}
.card + .card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--text-dim)}
.faint{color:var(--text-faint)}
.sec-title{
  font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-faint);margin:22px 0 9px;
}
.sec-title:first-child{margin-top:4px}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;white-space:nowrap;
}
.pill-strength{background:var(--accent-soft);color:var(--accent)}
.pill-hypertrophy{background:var(--pink-soft);color:var(--pink)}
.pill-deload{background:var(--surface-3);color:var(--text)}
.pill-hit{background:var(--hit-soft);color:var(--hit)}
.pill-miss{background:var(--miss-soft);color:var(--miss)}
.pill-flat{background:var(--surface-2);color:var(--text-dim)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface-2);color:var(--text);
  border-radius:var(--r-m);padding:12px 16px;
  font-weight:700;font-size:14px;letter-spacing:-.01em;
  border:1px solid transparent;transition:transform .08s;
}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-lg{width:100%;padding:16px;font-size:16px;border-radius:14px}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:9px}
.btn-danger{background:var(--miss-soft);color:var(--miss)}

.chipbar{display:flex;gap:7px;overflow-x:auto;padding:2px 14px 10px;margin:0 -14px;scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;
  background:var(--surface-2);color:var(--text-dim);
  font-size:12.5px;font-weight:700;white-space:nowrap;border:1px solid transparent;
}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}

.empty{
  text-align:center;padding:38px 20px;color:var(--text-faint);
  border:1px dashed var(--line);border-radius:var(--r-l);font-size:13.5px;
}

/* ============================================================
   TODAY
   ============================================================ */
.meso-strip{display:flex;gap:3px;margin-top:12px}
.meso-week{
  flex:1;height:26px;border-radius:5px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--text-faint);
  position:relative;overflow:hidden;
}
.meso-week[data-p="strength"]{background:var(--accent-soft);color:var(--accent)}
.meso-week[data-p="hypertrophy"]{background:var(--pink-soft);color:var(--pink)}
.meso-week[data-p="deload"]{background:var(--surface-3);color:var(--text-dim)}
.meso-week[data-now="1"]{outline:2px solid var(--text);outline-offset:-2px;font-weight:600;color:var(--text)}

.today-hero{
  background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r-l);padding:18px;box-shadow:var(--shadow);
}
.today-hero h2{font-size:32px;font-weight:900;letter-spacing:-.035em;margin:6px 0 2px;line-height:1.02}
.today-focus{font-size:13.5px;color:var(--text-dim);margin:0}

.plan-list{display:flex;flex-direction:column;gap:1px;margin-top:16px;
  border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line-soft)}
.plan-row{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:11px 13px;background:var(--surface-2);
}
.plan-row .nm{font-weight:600;font-size:14px;letter-spacing:-.01em}
.plan-row .sub{font-size:11.5px;color:var(--text-faint);margin-top:1px}
.plan-rx{text-align:right;font-family:var(--f-mono);font-size:13px;font-weight:600;white-space:nowrap}
.plan-rx .w{font-size:15px}
.plan-rx .r{color:var(--text-dim);font-size:11.5px;display:block;margin-top:1px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-m);padding:12px 11px}
.stat .k{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.stat .v{font-family:var(--f-mono);font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:4px;line-height:1}
.stat .u{font-size:11px;font-weight:500;color:var(--text-faint);margin-left:2px}

/* ============================================================
   SESSION LOGGER
   ============================================================ */
.sess-head{
  position:sticky;top:0;z-index:20;margin:0 -14px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;
  background:color-mix(in srgb,var(--bg) 93%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.sess-head .t{font-size:19px;font-weight:800;letter-spacing:-.02em}
.timer-bar{
  display:flex;align-items:center;gap:12px;margin-top:9px;
  background:var(--surface-2);border-radius:13px;padding:9px 12px;
  transition:background .2s, padding .2s;
}
.timer-bar.live{background:var(--accent);padding:13px 14px}
.timer-lbl{
  font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--text-faint);flex:0 0 auto;
}
.timer-bar.live .timer-lbl{color:var(--accent-ink);opacity:.8}
.timer-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.timer-val{
  font-family:var(--f-mono);font-size:19px;font-weight:600;letter-spacing:-.04em;
  line-height:1;font-variant-numeric:tabular-nums;transition:font-size .2s;
}
.timer-bar.live .timer-val{font-size:38px;color:var(--accent-ink)}
.timer-track{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.timer-bar.live .timer-track{background:color-mix(in srgb,var(--accent-ink) 26%,transparent)}
.timer-fill{height:100%;background:var(--accent);width:0%;transition:width 1s linear}
.timer-bar.live .timer-fill{background:var(--accent-ink)}
.timer-adj{
  flex:0 0 auto;font-family:var(--f-mono);font-size:13px;font-weight:600;
  background:var(--surface-3);border-radius:9px;padding:10px 12px;
}
.timer-bar.live .timer-adj{background:color-mix(in srgb,var(--accent-ink) 20%,transparent);
  color:var(--accent-ink)}
@keyframes ping{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.tick.just{animation:ping .26s ease-out}

.ex-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-l);overflow:hidden}
.ex-card.done{opacity:.62}
.ex-head{padding:13px 14px 11px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-head .nm{font-weight:700;font-size:15.5px;letter-spacing:-.015em;line-height:1.2}
.ex-head .meta{font-size:11.5px;color:var(--text-faint);margin-top:3px}
.ex-rx{
  display:flex;gap:8px;padding:0 14px 11px;flex-wrap:wrap;
}
.rx-tag{
  font-family:var(--f-mono);font-size:11px;font-weight:600;
  background:var(--surface-2);border-radius:6px;padding:3px 7px;color:var(--text-dim);
}
.why{
  margin:0 14px 12px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;
  background:var(--surface-2);color:var(--text-dim);border-left:3px solid var(--line);
}
.why.warn{background:var(--pink-soft);color:var(--pink);border-left-color:var(--pink)}
.why.hit{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent)}

.set-tbl{border-top:1px solid var(--line-soft)}
.set-hdr,.set-row{
  display:grid;grid-template-columns:18px 1fr 1fr 46px 42px;
  gap:5px;align-items:center;padding:8px 9px;
}
.set-hdr{
  font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-faint);padding-top:9px;padding-bottom:4px;
}
.set-hdr span:nth-child(2),.set-hdr span:nth-child(3){text-align:center}
.set-hdr span:nth-child(4){text-align:center}
.set-row{border-top:1px solid var(--line-soft)}
.set-row.logged{background:var(--accent-soft)}
.set-n{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--text-faint)}
.set-row.logged .set-n{color:var(--hit)}

.stepper{display:flex;align-items:center;background:var(--surface-2);border-radius:9px;overflow:hidden}
.set-row.logged .stepper{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.stepper button{
  width:29px;height:40px;display:grid;place-items:center;
  font-size:17px;font-weight:600;color:var(--text-dim);flex:0 0 auto;
}
.stepper button:active{background:var(--surface-3)}
.stepper .val{
  flex:1;text-align:center;font-family:var(--f-mono);font-size:16.5px;font-weight:600;
  letter-spacing:-.03em;min-width:0;padding:0 1px;
}
.stepper input.val{background:transparent;border:none;width:100%;text-align:center;
  -moz-appearance:textfield;appearance:textfield}
.stepper input.val::-webkit-outer-spin-button,
.stepper input.val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.rir-sel{
  height:40px;border-radius:9px;background:var(--surface-2);border:none;
  font-family:var(--f-mono);font-size:14px;font-weight:600;text-align:center;
  padding:0 2px;width:100%;
}
.set-row.logged .rir-sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}

.tick{
  width:42px;height:40px;border-radius:9px;background:var(--surface-2);
  display:grid;place-items:center;color:var(--text-faint);
}
.tick svg{width:19px;height:19px;stroke-width:2.6}
.set-row.logged .tick{background:var(--accent);color:var(--accent-ink)}

.ex-foot{display:flex;gap:8px;padding:9px 10px 12px;border-top:1px solid var(--line-soft)}
.ex-foot .btn{flex:1}

/* The tab bar is hidden during a session, so this sits near the real bottom.
   The fade keeps the card underneath from colliding with the button. */
.sess-actions{
  position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  z-index:15;margin-top:18px;padding-top:22px;
  background:linear-gradient(180deg, transparent 0%, var(--bg) 58%);
}

/* feedback sheet */
.fb-group{padding:13px 0;border-bottom:1px solid var(--line-soft)}
.fb-group:last-child{border-bottom:none}
.fb-group .m{font-weight:700;font-size:14px;margin-bottom:9px}
.fb-q{display:grid;grid-template-columns:62px 1fr;gap:9px;align-items:center;margin-bottom:7px}
.fb-q .lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
.fb-opts{display:grid;gap:4px}
.fb-opts.n3{grid-template-columns:repeat(3,1fr)}
.fb-opts.n4{grid-template-columns:repeat(4,1fr)}
.fb-opt{
  padding:8px 2px;border-radius:8px;background:var(--surface-2);
  font-size:11px;font-weight:700;text-align:center;color:var(--text-dim);
}
.fb-opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ============================================================
   PROGRESS
   ============================================================ */
.chart-wrap{margin:0 -4px;overflow-x:auto}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.vol-row{display:grid;grid-template-columns:76px 1fr 44px;gap:9px;align-items:center;padding:6px 0}
.vol-name{font-size:12.5px;font-weight:600}
.vol-track{height:20px;background:var(--surface-2);border-radius:5px;position:relative;overflow:hidden}
.vol-fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.vol-fill.under{background:var(--pink)}
.vol-fill.over{background:var(--pink)}
.vol-mev,.vol-mrv{position:absolute;top:0;bottom:0;width:2px;background:var(--text-faint);opacity:.55}
.vol-num{font-family:var(--f-mono);font-size:12.5px;font-weight:600;text-align:right}

.pr-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.pr-row:last-child{border-bottom:none}

/* ============================================================
   FEED
   ============================================================ */
.fcard{
  background:var(--surface);border:1px solid var(--line-soft);
  border-radius:var(--r-l);padding:15px;
}
.fcard + .fcard{margin-top:10px}
.fcard.you{border-color:var(--pink);background:linear-gradient(180deg,var(--pink-soft) 0%, var(--surface) 52%)}
.fcard h3{font-size:16.5px;font-weight:800;letter-spacing:-.02em;margin:8px 0 5px;line-height:1.22;text-wrap:balance}
.fcard .take{font-size:13.5px;color:var(--text-dim);margin:0;line-height:1.5}
.fcard .body{font-size:13.5px;line-height:1.62;margin:11px 0 0;color:var(--text)}
.fcard .body p{margin:0 0 9px}
.fcard .body p:last-child{margin-bottom:0}
.fcard .body ul{margin:0 0 9px;padding-left:17px}
.fcard .body li{margin-bottom:4px}
.fcard .src{
  margin-top:12px;padding-top:10px;border-top:1px solid var(--line-soft);
  font-size:11px;color:var(--text-faint);display:flex;justify-content:space-between;gap:10px;
}
.tier{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 7px;border-radius:5px}
.tier-strong{background:var(--accent);color:var(--accent-ink)}
.tier-moderate{background:var(--accent-soft);color:var(--accent)}
.tier-weak{background:var(--surface-3);color:var(--text-dim)}
.tier-none{background:var(--pink-soft);color:var(--pink)}
.expander{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--accent)}

/* ============================================================
   PLAN / SETTINGS
   ============================================================ */
.day-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-l);overflow:hidden}
.day-card + .day-card{margin-top:11px}
.day-head{padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--surface-2)}
.day-head .nm{font-weight:800;font-size:15px;letter-spacing:-.015em}
.day-head .ct{font-family:var(--f-mono);font-size:11.5px;color:var(--text-faint)}
.ex-line{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  padding:10px 14px;border-top:1px solid var(--line-soft)}
.ex-line .nm{font-size:13.5px;font-weight:600}
.ex-line .mg{font-size:11px;color:var(--text-faint);margin-top:1px}
.setcount{display:flex;align-items:center;gap:0;background:var(--surface-2);border-radius:8px}
.setcount button{width:28px;height:30px;display:grid;place-items:center;color:var(--text-dim);font-size:15px}
.setcount .v{font-family:var(--f-mono);font-size:13px;font-weight:600;width:22px;text-align:center}
.xbtn{width:30px;height:30px;display:grid;place-items:center;color:var(--text-faint);border-radius:8px}
.xbtn:active{background:var(--surface-2)}

.field{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line-soft)}
.field:last-child{border-bottom:none}
.field .lbl{font-size:13.5px;font-weight:600}
.field .hint{font-size:11.5px;color:var(--text-faint);margin-top:2px;line-height:1.35}
.field input[type="number"],.field select{
  background:var(--surface-2);border:1px solid transparent;border-radius:9px;
  padding:9px 10px;font-family:var(--f-mono);font-size:14px;font-weight:600;
  text-align:right;width:92px;
}
.field select{text-align:left;width:auto;font-family:var(--f-display)}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--text-dim)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* modal */
.sheet-bg{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .16s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--bg);width:100%;max-width:560px;
  border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(22px)}to{transform:translateY(0)}}
.sheet h2{font-size:20px;font-weight:900;letter-spacing:-.025em;margin:0 0 3px}
.sheet .sub{font-size:13px;color:var(--text-dim);margin:0 0 16px}
.search{
  width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:11px;
  padding:12px 13px;font-size:15px;margin-bottom:12px;
}
.pick{padding:12px 13px;border-radius:11px;background:var(--surface);
  border:1px solid var(--line-soft);margin-bottom:7px;display:block;width:100%;text-align:left}
.pick .nm{font-weight:600;font-size:14px}
.pick .mg{font-size:11.5px;color:var(--text-faint);margin-top:2px}

.banner{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--warn-soft);color:var(--warn);
  border-radius:var(--r-m);padding:11px 13px;font-size:12.5px;line-height:1.45;
  margin-bottom:12px;
}
.banner button{font-weight:800;text-decoration:underline;white-space:nowrap}
.syncdot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex:0 0 auto}
.syncdot.on{background:var(--hit)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 18px);
  background:var(--text);color:var(--bg);padding:11px 17px;border-radius:999px;
  font-size:13px;font-weight:700;z-index:80;box-shadow:var(--shadow-lift);
  animation:up .2s ease-out;
}
</style>

const LIB = SEED.EX.map(function(r){
  return { id:r[0], name:r[1], muscle:SEED.MUS[r[2]], load:r[3] ? 'lower' : 'upper',
           comp:!!r[4], secondary:r[5].map(function(i){ return SEED.MUS[i]; }) };
});
const LIB_BY_NAME = {}, LIB_BY_ID = {};
LIB.forEach(function(e){ LIB_BY_NAME[e.name] = e; LIB_BY_ID[e.id] = e; });

function mkExId(id, sets){
  const b = LIB_BY_ID[id];
  if(!b) throw new Error('unknown exercise id: ' + id);
  return { id:b.id, name:b.name, muscle:b.muscle, load:b.load, comp:b.comp,
           secondary:b.secondary, sets:sets };
}
function mkEx(name, sets){ return mkExId(LIB_BY_NAME[name].id, sets); }

const DAY_IDS   = ['push1','pull','push2','legs','mix'];
const DAY_NAMES = ['Push 1','Pull','Push 2','Legs','Mix'];
const PHASE_IDS = ['strength','hypertrophy','deload'];

/** Expand the packed archive into full session records. */
function expandArchive(){
  return SEED.ARCH.map(function(a){
    const di = a[1];
    return {
      id:'h' + a[0] + '-' + DAY_IDS[di], date:a[0], dayId:DAY_IDS[di],
      dayName:DAY_NAMES[di], phase:PHASE_IDS[a[2]], week:1, block:0,
      entries:a[3].map(function(e){
        const ex = LIB[e[0]], w = e[1], rir = e[2], lo = e[3], hi = e[4];
        const sets = [];
        for(let i = 0; i < e[5]; i++)
          sets.push({ w:w, reps:Math.max(lo, hi - i), rir:rir, done:true });
        return { exId:ex.id, name:ex.name, muscle:ex.muscle,
                 secondary:ex.secondary, range:[lo, hi], sets:sets };
      }),
      feedback:{}, duration:0, notes:'', arch:true, updatedAt:0
    };
  }).sort(function(x, y){ return x.date < y.date ? 1 : -1; });
}

/* ---------- 3. Default program ------------------------------------------- */

function defaultProgram(){
  return { days: SEED.PROG.map(function(p){
    return { id:p.id, name:p.name, focus:p.focus,
             exercises: p.ex.map(function(e){ return mkExId(e[0], e[1]); }) };
  })};
}

function defaultState(){
  return {
    v:1,
    settings:{ units:'kg', incUpper:2.5, incLower:5, rest:60, autoreg:true, theme:'dark', dyslexic:false },
    meso:{
      blocks:[ {type:'strength',weeks:5}, {type:'deload',weeks:1},
               {type:'hypertrophy',weeks:6}, {type:'deload',weeks:1} ],
      cursor:{ block:0, week:2, day:0 },
      cycle:1
    },
    program: defaultProgram(),
    sessions: [],
    bodyweight: [],
    volAdj: {},
    seen: {},
    build: BUILD,
    tweaks: TWEAKS,
    ui:{ tab:'today' }
  };
}

/* ---------- 4. State, persistence, sync ---------------------------------- */

const LS_KEY = 'ironledger.v1';
const BUILD = '2026-09-16-archive';
const TWEAKS = 'rest60';
let S = null;
let DB = null;
let dbStatus = 'local';
const dirtySessions = new Set();
let configDirty = false;

function load(){
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch(e){}
  if(raw){
    try {
      const p = JSON.parse(raw);
      if(p && p.v === 1){ S = p; migrate(); adoptArchive(); applyTweaks(); return; }
    } catch(e){}
  }
  S = defaultState();
  S.sessions = expandArchive();
}

/** Small one-off settings corrections, independent of the archive migration. */
function applyTweaks(){
  if(S.tweaks === TWEAKS) return;
  if(S.settings.rest === 150) S.settings.rest = 60;   // shipped default -> his actual rest
  S.tweaks = TWEAKS;
  configDirty = true;
}

/**
 * The written-log archive ships inside the app. A state saved before it existed
 * (or by any earlier build) has to take it on — without disturbing anything
 * logged since. Runs once; the build stamp makes it idempotent.
 */
function adoptArchive(){
  S.sessions = (S.sessions || []).filter(function(x){ return !x.sample; });
  if(S.build === BUILD) return;
  const mine = S.sessions.filter(function(x){ return !x.arch; });
  S.sessions = expandArchive().concat(mine)
    .sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  const d = defaultState();
  S.program = d.program;
  S.meso = d.meso;
  S.volAdj = {};
  S.build = BUILD;
  configDirty = true;
}
function migrate(){
  const d = defaultState();
  S.settings = Object.assign({}, d.settings, S.settings||{});
  S.meso = Object.assign({}, d.meso, S.meso||{});
  S.ui = S.ui || {tab:'today'};
  S.volAdj = S.volAdj || {};
  S.seen = S.seen || {};
  S.bodyweight = S.bodyweight || [];
  S.sessions = S.sessions || [];
}
let saveTimer = null;
function save(opts){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
  if(opts && opts.config) configDirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, 1200);
}

/* ---- remote mirror (claude db capability) ---- */
async function initRemote(){
  if(typeof window.claude === 'undefined' || !window.claude.use) return;
  let db = null;
  try { db = await window.claude.use('db'); } catch(e){ return; }
  if(!db) return;
  DB = db;
  try {
    const cfg = await DB.doc('app/config').get();
    if(cfg.exists){
      const r = cfg.data();
      if(r.build === BUILD && (r.updatedAt||0) > (S.configUpdatedAt||0)){
        S.settings = Object.assign(S.settings, r.settings||{});
        S.meso = r.meso || S.meso;
        S.program = r.program || S.program;
        S.volAdj = r.volAdj || S.volAdj;
        S.bodyweight = r.bodyweight || S.bodyweight;
        S.seen = r.seen || S.seen;
        S.configUpdatedAt = r.updatedAt;

      }
    }
    const snap = await DB.collection('sessions').orderBy('date','desc').limit(400).get();
    if(snap.size > 0){
      const byId = {};
      S.sessions.forEach(function(x){ byId[x.id] = x; });
      snap.docs.forEach(function(d){
        const r = d.data();
        if(r.sample) return;
        const local = byId[d.id];
        if(!local || (r.updatedAt||0) >= (local.updatedAt||0)) byId[d.id] = r;
      });
      S.sessions = Object.keys(byId).map(function(k){ return byId[k]; })
        .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    }
    dbStatus = 'synced';
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
    render();
    pushRemote();
  } catch(e){ dbStatus = 'local'; }
}
async function pushRemote(){
  if(!DB) return;
  try {
    if(configDirty){
      configDirty = false;
      S.configUpdatedAt = Date.now();
      await DB.doc('app/config').set({
        settings:S.settings, meso:S.meso, program:S.program, volAdj:S.volAdj,
        bodyweight:S.bodyweight, seen:S.seen, sessionCount:S.sessions.length,
        build:BUILD, updatedAt:S.configUpdatedAt
      });
    }
    const ids = Array.from(dirtySessions); dirtySessions.clear();
    for(const id of ids){
      const s = S.sessions.find(function(x){ return x.id === id; });
      if(s && !s.arch) await DB.doc('sessions/' + id).set(s);
      else await DB.doc('sessions/' + id).delete().catch(function(){});
    }
  } catch(e){ /* stay local; retry on next save */ }
}

/* ---------- 5. Units & maths --------------------------------------------- */

const U = function(){ return S.settings.units; };
function inc(ex){
  const kg = ex.load === 'lower' ? S.settings.incLower : S.settings.incUpper;
  return U() === 'kg' ? kg : Math.round(kg * 2.2046 / 2.5) * 2.5;
}
function grid(){ return U() === 'kg' ? 1.25 : 2.5; }
function roundLoad(x){ const g = grid(); return Math.max(0, Math.round(x / g) * g); }
function fmtW(x){
  if(x === null || x === undefined) return '—';
  return (Math.round(x * 100) / 100).toString().replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
}
// Epley, adjusted so reps-in-reserve count as reps not performed.
function e1rm(w, reps, rir){
  const eff = reps + (rir || 0);
  if(!w || !reps || eff > 14) return 0;
  return w * (1 + eff / 30);
}
function loadForReps(oneRM, reps, rir){
  const eff = reps + (rir || 0);
  return oneRM / (1 + eff / 30);
}

/* ---------- 6. Mesocycle cursor ------------------------------------------ */

function blocks(){ return S.meso.blocks; }
function curBlock(){ return blocks()[S.meso.cursor.block] || blocks()[0]; }
function curPhase(){ return curBlock().type; }
function curWeek(){ return S.meso.cursor.week; }
function curDay(){ return S.program.days[S.meso.cursor.day % S.program.days.length]; }
function targetRir(phase, week){
  const arr = PHASE[phase].rirByWeek;
  return arr[Math.min(week - 1, arr.length - 1)];
}
function repRange(ex, phase){ return ex.comp ? PHASE[phase].comp : PHASE[phase].iso; }

function setsFor(ex, phase, week){
  const base = ex.sets;
  if(phase === 'deload') return Math.max(1, Math.ceil(base / 2));
  if(phase === 'strength') return base;
  // hypertrophy: schedule ramp + autoregulated adjustment, capped by MRV headroom
  const ramp = Math.min(Math.floor((week - 1) / 2), 2);
  const adj = clamp(S.volAdj[ex.muscle] || 0, -2, 3);
  return clamp(base + ramp + adj, 1, base + 4);
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

function advanceCursor(){
  const c = S.meso.cursor;
  c.day += 1;
  if(c.day >= S.program.days.length){
    c.day = 0;
    c.week += 1;
    const b = blocks()[c.block];
    if(c.week > b.weeks){
      c.week = 1;
      c.block += 1;
      if(c.block >= blocks().length){ c.block = 0; S.meso.cycle += 1; }
      S.volAdj = {}; // volume ramp restarts each block
    }
  }
}
function weekTimeline(){
  const out = []; let i = 0;
  blocks().forEach(function(b, bi){
    for(let w = 1; w <= b.weeks; w++){
      out.push({ i:i++, block:bi, week:w, type:b.type,
                 now: bi === S.meso.cursor.block && w === S.meso.cursor.week });
    }
  });
  return out;
}

/* ---------- 7. History & prescription ------------------------------------ */

function history(exId, opts){
  const skipDeload = !opts || opts.skipDeload !== false;
  return S.sessions.filter(function(s){
    if(skipDeload && s.phase === 'deload') return false;
    return s.entries.some(function(e){
      return e.exId === exId && e.sets.some(function(st){ return st.done; });
    });
  }).map(function(s){
    const e = s.entries.find(function(x){ return x.exId === exId; });
    const sets = e.sets.filter(function(st){ return st.done && st.reps > 0; });
    return { date:s.date, phase:s.phase, week:s.week, sets:sets,
             load: sets.length ? Math.max.apply(null, sets.map(function(x){ return x.w; })) : 0,
             range: e.range || null };
  }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
}

function bestE1rm(exId){
  let best = 0, when = null;
  S.sessions.forEach(function(s){
    s.entries.forEach(function(e){
      if(e.exId !== exId) return;
      e.sets.forEach(function(st){
        if(!st.done) return;
        const v = e1rm(st.w, st.reps, st.rir);
        if(v > best){ best = v; when = s.date; }
      });
    });
  });
  return { value:best, date:when };
}

/**
 * Decide the load, and say why.
 * Within a block: double progression — clear every set at the top of the
 * range inside the RIR target and the load goes up.
 * Across a block boundary the rep range changes, so re-anchor from e1RM.
 */
function prescribe(ex, phase, week){
  const range = repRange(ex, phase);
  const rir = targetRir(phase, week);
  const hist = history(ex.id);
  const step = inc(ex);

  if(!hist.length){
    const any = history(ex.id, {skipDeload:false});
    if(!any.length){
      return { load:null, range:range, rir:rir, sets:setsFor(ex, phase, week),
               why:'First time logging this. Pick a weight you could do ' + range[1] +
                   ' reps with and still leave ' + rir + ' in the tank.', tone:'' };
    }
  }
  const last = hist[0];
  const prevRange = last.range;
  const rangeChanged = prevRange && Math.abs(prevRange[1] - range[1]) >= 2;

  let load, why = '', tone = '';

  if(rangeChanged){
    const best = bestE1rm(ex.id).value;
    const anchor = best || e1rm(last.load, last.sets[0].reps, last.sets[0].rir);
    const raw = loadForReps(anchor, range[0], rir);
    const capped = clamp(raw, last.load * 0.88, last.load * 1.12);
    load = roundLoad(capped);
    why = 'New block, new rep range (' + prevRange[0] + '–' + prevRange[1] + ' → ' +
          range[0] + '–' + range[1] + '). Re-anchored off your best estimated 1RM of ' +
          fmtW(anchor) + ' ' + U() +
          (capped !== raw ? ', held to a 12% step from last time.' : '.');
    tone = '';
  } else {
    const topHit = last.sets.length > 0 && last.sets.every(function(st){
      return st.reps >= range[1] && st.rir <= targetRir(last.phase, last.week);
    });
    const anyShort = last.sets.some(function(st){ return st.reps < range[0]; });
    const twoShort = hist.length > 1 && anyShort &&
      hist[1].sets.some(function(st){ return st.reps < range[0]; });

    if(topHit){
      load = roundLoad(last.load + step);
      why = 'You cleared ' + range[1] + ' on every set last time at or under target RIR. ' +
            'Up ' + fmtW(step) + ' ' + U() + ' — reps will drop back toward ' + range[0] + '.';
      tone = 'hit';
    } else if(twoShort){
      load = Math.floor(last.load * 0.93 / grid()) * grid();
      why = 'Two sessions under ' + range[0] + ' reps. Backing off ~7% to get back inside the range.';
      tone = 'warn';
    } else if(anyShort){
      load = last.load;
      why = 'A set fell under ' + range[0] + ' reps. Hold ' + fmtW(last.load) + ' ' + U() +
            ' and win the reps back.';
      tone = 'warn';
    } else {
      load = last.load;
      const need = last.sets.filter(function(st){ return st.reps < range[1]; }).length;
      why = 'Same load. ' + need + ' set' + (need === 1 ? '' : 's') + ' still short of ' +
            range[1] + ' — add reps there, then the weight goes up.';
      tone = '';
    }
    // stall check
    if(hist.length >= 3){
      const same = hist[0].load === hist[1].load && hist[1].load === hist[2].load;
      const flat = totalReps(hist[0]) <= totalReps(hist[1]) && totalReps(hist[1]) <= totalReps(hist[2]);
      if(same && flat && phase !== 'deload'){
        why = 'Stalled: three sessions at ' + fmtW(last.load) + ' ' + U() +
              ' with no rep gain. Check sleep and calories first, then consider swapping ' +
              'this movement at the next block.';
        tone = 'warn';
      }
    }
  }

  // A layoff resets readiness regardless of what the rep maths says.
  if(load !== null && last){
    const gap = Math.round((Date.now() - new Date(last.date + 'T12:00:00')) / 86400000);
    if(gap > 42){
      const g = grid();
      load = Math.min(load, Math.floor(last.load * 0.9 / g) * g);
      why = Math.round(gap / 7) + ' weeks since you last did this. Opening 10% under ' +
            'your old working load — get the pattern back, then climb.';
      tone = 'warn';
    } else if(gap > 21){
      load = Math.min(load, last.load);
      why = Math.round(gap / 7) + ' weeks since you last did this. Holding ' +
            fmtW(last.load) + ' ' + U() + ' rather than adding — earn the increase again.';
      tone = 'warn';
    }
  }

  if(phase === 'deload'){
    const base = load || 0;
    load = Math.floor(base * 0.65 / grid()) * grid();
    why = 'Deload — ~65% of working load, half the sets, ' + rir + ' reps in reserve. ' +
          'The point is to arrive at the next block fresh.';
    tone = 'warn';
  }
  return { load:load, range:range, rir:rir, sets:setsFor(ex, phase, week), why:why, tone:tone };
}
function totalReps(h){ return h.sets.reduce(function(a,b){ return a + b.reps; }, 0); }

/* ---------- 8. Volume autoregulation (RP feedback table) ----------------- */
// soreness 0 none / 1 little / 2 lots / 3 still sore
// pump 0 low / 1 moderate / 2 high ; perf 0 down / 1 same / 2 up
function setDelta(f){
  if(f.sore === 3) return -1;
  if(f.sore === 2) return 0;
  let d;
  if(f.sore === 0) d = f.pump === 0 ? 3 : f.pump === 1 ? 2 : 1;
  else d = f.pump === 0 ? 2 : f.pump === 1 ? 1 : 1;
  if(f.perf === 0) d -= 1;
  return clamp(d - 1, -1, 2); // scale to per-session set change
}
function applyFeedback(fb){
  Object.keys(fb || {}).forEach(function(m){
    const d = setDelta(fb[m]);
    S.volAdj[m] = clamp((S.volAdj[m] || 0) + d, -2, 3);
  });
}

/* ---------- 9. Weekly volume -------------------------------------------- */

function isoOffset(n){
  const d = new Date(); d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}
function weekKey(dateStr){
  const d = new Date(dateStr + 'T12:00:00');
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0,10);
}
function volumeByMuscle(weeksBack){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7 * (weeksBack || 1));
  const iso = cutoff.toISOString().slice(0,10);
  const out = {};
  S.sessions.forEach(function(s){
    if(s.date < iso) return;
    s.entries.forEach(function(e){
      const n = e.sets.filter(function(st){ return st.done; }).length;
      if(!n) return;
      out[e.muscle] = (out[e.muscle] || 0) + n;
      (e.secondary || []).forEach(function(m){ out[m] = (out[m] || 0) + n * 0.5; });
    });
  });
  return out;
}

  { id:'failure', cat:'Training', tier:'moderate', src:'Refalo et al. 2023 meta-analysis',
    t:'Training to failure is a cost, not a virtue',
    take:'Sets taken to 0–1 RIR grow muscle about as well as sets to failure, and cost far less recovery.',
    body:'<p>Failure has a modest hypertrophy edge at best and a clear disadvantage for fatigue, session quality and joint stress — particularly on compounds.</p><p>A reasonable policy: take isolation work to failure in the last week or two of a block, and keep compounds at 1–2 RIR nearly always. That is what the RIR ramp in this app encodes.</p>' }
];

/* generated insight cards from the user's own log */
function insights(){
  const out = [];
  const done = S.sessions.filter(function(s){ return s.entries.some(function(e){
    return e.sets.some(function(x){ return x.done; }); }); });
  if(!done.length) return out;

  // 1. stalled lifts
  const stalled = [];
  allExercises().forEach(function(ex){
    const h = history(ex.id);
    if(h.length < 3) return;
    if(h[0].load === h[1].load && h[1].load === h[2].load &&
       totalReps(h[0]) <= totalReps(h[1])) stalled.push(ex.name);
  });
  if(stalled.length){
    out.push({ id:'you-stall', cat:'For you', tier:'', you:true, src:'From your log',
      t: stalled.length === 1 ? stalled[0] + ' has stopped moving'
                              : stalled.length + ' lifts have stopped moving',
      take:'Three sessions at the same load with no added reps: ' + stalled.join(', ') + '.',
      body:'<p>Before changing anything in the program, check the two things that stall lifts most often: sleep under seven hours, and eating at or below maintenance. Both make added load impossible regardless of programming.</p><p>If both are fine, swap the movement at your next block boundary rather than mid-block — you need stable data to run double progression.</p>' });
  }

  // 2. volume vs landmarks
  const vol = volumeByMuscle(1);
  const under = [], over = [];
  Object.keys(LANDMARK).forEach(function(m){
    const lm = LANDMARK[m]; if(!lm.mev) return;
    const v = Math.round(vol[m] || 0);
    if(v > 0 && v < lm.mev) under.push(m + ' (' + v + ' vs ' + lm.mev + ')');
    if(v > lm.mrv) over.push(m + ' (' + v + ' vs ' + lm.mrv + ')');
  });
  if(under.length || over.length){
    out.push({ id:'you-vol', cat:'For you', tier:'', you:true, src:'From your log · last 7 days',
      t:'Your weekly set count is off the landmarks',
      take:(under.length ? 'Below minimum: ' + under.join(', ') + '. ' : '') +
           (over.length ? 'Above your likely ceiling: ' + over.join(', ') + '.' : ''),
      body:'<p>These landmarks are population estimates, not your personal numbers — but a muscle sitting under its minimum effective volume for weeks is the most common reason one body part lags.</p>' +
           (over.length ? '<p>Being over the maximum recoverable volume is usually worse than being slightly under it: the sets stop contributing and start costing recovery you need elsewhere.</p>' : '') });
  }

  // 3. best recent lift
  let bestGain = null;
  allExercises().forEach(function(ex){
    const h = history(ex.id).slice(0, 12);   // recent form, not 2024
    if(h.length < 4) return;
    if(h[0].date < isoOffset(-21)) return;   // dormant lifts don't count
    const now = bestSetE1rm(h[0]), then = bestSetE1rm(h[h.length-1]);
    if(!then) return;
    const pct = (now - then) / then * 100;
    if(pct > 2 && (!bestGain || pct > bestGain.pct))
      bestGain = { name:ex.name, pct:pct, sessions:h.length };
  });
  if(bestGain){
    out.push({ id:'you-best', cat:'For you', tier:'', you:true, src:'From your log',
      t:bestGain.name + ' is your strongest trend',
      take:'Estimated 1RM up ' + bestGain.pct.toFixed(1) + '% across your last ' +
           bestGain.sessions + ' sessions of it.',
      body:'<p>Worth noticing which lifts respond to your current setup and which do not. A movement that climbs steadily is one to keep through the next block; the flat ones are your rotation candidates.</p>' });
  }

  // 4. phase-contextual card
  const ph = curPhase();
  if(ph === 'deload'){
    out.push({ id:'you-deload', cat:'For you', tier:'', you:true, src:'Where you are in the block',
      t:'You are in a deload week',
      take:'Half the sets, about 65% of your working loads, 4 reps in reserve.',
      body:'<p>Resist the urge to "make it count". The purpose is to arrive at the next block with the fatigue gone and the movement patterns intact. Every prescription in Today has already been scaled — just follow them.</p><p>Keep protein and sleep exactly where they were. Recovery is the training this week.</p>' });
  } else if(curWeek() === 1){
    out.push({ id:'you-wk1', cat:'For you', tier:'', you:true, src:'Where you are in the block',
      t:'Week 1 of a ' + PHASE[ph].label.toLowerCase() + ' block',
      take:PHASE[ph].note,
      body:'<p>Target is ' + targetRir(ph, 1) + ' reps in reserve. That should feel conservative — it is meant to. The loads you set this week are the base the whole block progresses from, so err slightly light rather than slightly heavy.</p>' });
  }
  return out;
}
function bestSetE1rm(h){
  return h.sets.reduce(function(a, st){ return Math.max(a, e1rm(st.w, st.reps, st.rir)); }, 0);
}
function allExercises(){
  const seen = {}, out = [];
  S.program.days.forEach(function(d){ d.exercises.forEach(function(e){
    if(!seen[e.id]){ seen[e.id] = 1; out.push(e); } }); });
  return out;
}

function sessionsThisWeek(){
  const k = weekKey(new Date().toISOString().slice(0,10));

function computeStreak(){
  const keys = {};
  S.sessions.forEach(function(s){ keys[weekKey(s.date)] = 1; });
  let n = 0;
  const d = new Date();
  for(let i = 0; i < 60; i++){
    const k = weekKey(d.toISOString().slice(0,10));
    if(keys[k]) n++;
    else if(i > 0) break;
    d.setDate(d.getDate() - 7);
  }
  return n;
}

function lineChart(exId){
  const days = S.ui.chartRange === undefined ? 365 : S.ui.chartRange;
  let cut = '0000';
  if(days){ const c = new Date(); c.setDate(c.getDate() - days); cut = c.toISOString().slice(0,10); }
  const h = history(exId, {skipDeload:false}).slice().reverse();
  const pts = h.map(function(x){ return { d:x.date, v:bestSetE1rm(x) }; })
    .filter(function(p){ return p.v > 0 && p.d >= cut; });
  if(pts.length < 2) return '<div class="empty">Two logged sessions of this lift and a chart appears here.</div>';

  const W = 320, H = 130, PL = 34, PR = 8, PT = 12, PB = 22;
  const vals = pts.map(function(p){ return p.v; });
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const pad = Math.max((hi - lo) * 0.18, hi * 0.03, 1);
  lo = lo - pad; hi = hi + pad;
  const x = function(i){ return PL + i / (pts.length - 1) * (W - PL - PR); };
  const y = function(v){ return PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB); };
  const d = pts.map(function(p, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
  const area = d + ' L' + x(pts.length - 1).toFixed(1) + ' ' + (H - PB) + ' L' + PL + ' ' + (H - PB) + ' Z';
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
  const last = pts[pts.length - 1];

  return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H +
    '" role="img" aria-label="Estimated one rep max over time">' +
    ticks.map(function(t){
      return '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) +
        '" stroke="var(--line)" stroke-width="1"/>' +
        '<text x="' + (PL - 6) + '" y="' + (y(t) + 3.5).toFixed(1) + '" text-anchor="end" ' +
        'font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--text-faint)">' +
        Math.round(t) + '</text>'; }).join('') +
    '<path d="' + area + '" fill="var(--accent)" opacity="0.10"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>' +
    pts.map(function(p, i){
      const lastPt = i === pts.length - 1;
      if(!lastPt && pts.length > 40) return '';
      return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' +
        (lastPt ? 4 : 2.4) + '" fill="var(--accent)"/>'; }).join('') +
    '<text x="' + PL + '" y="' + (H - 6) + '" font-family="IBM Plex Mono, monospace" font-size="9" ' +
      'fill="var(--text-faint)">' + pts[0].d.slice(5) + '</text>' +
    '<text x="' + (W - PR) + '" y="' + (H - 6) + '" text-anchor="end" ' +
      'font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--text-faint)">' +
      last.d.slice(5) + '</text>' +
    '</svg></div>' +
    '<div class="spread" style="margin-top:8px"><span class="faint" style="font-size:11.5px">' +
      pts.length + ' sessions · Epley estimate</span>' +
      '<span class="mono" style="font-weight:600">' + fmtW(Math.round(last.v * 2) / 2) + ' ' + U() + '</span></div>';
}
function bwChart(bw){
  const W = 320, H = 92, PL = 32, PR = 8, PT = 10, PB = 18;
  const vals = bw.map(function(p){ return p.kg; });
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const pad = Math.max((hi - lo) * 0.25, 0.6); lo -= pad; hi += pad;
  const x = function(i){ return PL + i / (bw.length - 1) * (W - PL - PR); };
  const y = function(v){ return PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB); };
  const d = bw.map(function(p, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.kg).toFixed(1); }).join(' ');
  const delta = bw[bw.length - 1].kg - bw[0].kg;
  return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H +
    '" role="img" aria-label="Bodyweight trend">' +
    [lo + pad, hi - pad].map(function(t){
      return '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + y(t).toFixed(1) + '" y2="' + y(t).toFixed(1) +
        '" stroke="var(--line)" stroke-width="1"/><text x="' + (PL - 6) + '" y="' + (y(t) + 3.5).toFixed(1) +
        '" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9" ' +
        'fill="var(--text-faint)">' + t.toFixed(1) + '</text>'; }).join('') +
    '<path d="' + d + '" fill="none" stroke="var(--pink)" stroke-width="2" stroke-linejoin="round"/>' +
    bw.map(function(p, i){ return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.kg).toFixed(1) +
      '" r="2.6" fill="var(--pink)"/>'; }).join('') +
    '</svg></div><div class="spread" style="margin-top:6px">' +
    '<span class="faint" style="font-size:11.5px">' + bw.length + ' readings</span>' +
    '<span class="mono" style="font-weight:600;color:' + (delta >= 0 ? 'var(--hit)' : 'var(--warn)') + '">' +
    (delta >= 0 ? '+' : '') + delta.toFixed(1) + ' ' + U() + '</span></div>';
}

/* ---------- 14. Session lifecycle --------------------------------------- */

function startSession(){
  const day = curDay(), phase = curPhase(), week = curWeek();
  const entries = day.exercises.map(function(ex){
    const p = prescribe(ex, phase, week);
    const h = history(ex.id, {skipDeload:false});
    const prev = h[0];
    const sets = [];
    for(let i = 0; i < p.sets; i++){
      sets.push({ w: p.load === null ? 0 : p.load,
                  reps: p.range[1], rir: p.rir, done:false });
    }
    return { exId:ex.id, name:ex.name, muscle:ex.muscle, secondary:ex.secondary,
             range:p.range, rir:p.rir, target:p.load, why:p.why, tone:p.tone,
             prevText: prev ? fmtW(prev.load) + ' × ' +
               prev.sets.map(function(s){ return s.reps; }).join('/') : '',
             sets:sets };
  });
  S.ui.active = {
    id:'s' + Date.now(), date:new Date().toISOString().slice(0,10),
    dayId:day.id, dayName:day.name, phase:phase, week:week,
    block:S.meso.cursor.block, entries:entries, feedback:{}, notes:'',
    startedAt:Date.now()
  };
  save();
  render();
  startElapsed();
  keepAwake(true);
}
let elapsedTimer = null, restTimer = null, restLeft = 0, restTotal = 0;
let wakeLock = null;
/** Stop the phone locking itself between sets. */
async function keepAwake(on){
  try {
    if(on){
      if(!wakeLock && 'wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', function(){ wakeLock = null; });
      }
    } else if(wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e){ /* unsupported or denied - the session still works */ }
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && S && S.ui && S.ui.active) keepAwake(true);
});
function startElapsed(){
  clearInterval(elapsedTimer);
  elapsedTimer = setInterval(function(){
    const el = document.getElementById('elapsed');
    if(!el || !S.ui.active){ clearInterval(elapsedTimer); return; }
    el.textContent = mmss((Date.now() - S.ui.active.startedAt) / 1000);
  }, 1000);
}
function startRest(sec){
  restTotal = sec; restLeft = sec;
  clearInterval(restTimer);
  document.getElementById('timerbar') && document.getElementById('timerbar').classList.add('live');
  restTimer = setInterval(tickRest, 1000);
  paintRest();
}
function tickRest(){
  restLeft -= 1;
  if(restLeft <= 0){
    clearInterval(restTimer); restTimer = null; restLeft = 0;
    const bar = document.getElementById('timerbar');
    if(bar) bar.classList.remove('live');
    if(navigator.vibrate) navigator.vibrate([90, 60, 90]);
    beep();
  }
  paintRest();
}
function paintRest(){
  const v = document.getElementById('timerval'), f = document.getElementById('timerfill');
  const l = document.getElementById('timerlbl');
  if(v) v.textContent = mmss(restLeft || S.settings.rest);
  if(f) f.style.width = restTotal ? ((restTotal - restLeft) / restTotal * 100) + '%' : '0%';
  if(l) l.textContent = restTimer ? 'Resting' : 'Rest';
}
let actx = null;
function beep(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value = 660; g.gain.value = 0.08;
    o.start(); o.stop(actx.currentTime + 0.18);
  } catch(e){}
}
function finishSession(){
  const a = S.ui.active;
  const muscles = {};
  a.entries.forEach(function(e){
    if(e.sets.some(function(s){ return s.done; })) muscles[e.muscle] = true;
  });
  const list = Object.keys(muscles);
  if(S.settings.autoreg && list.length) openFeedback(list);
  else commitSession({});
}
function commitSession(fb){
  const a = S.ui.active;
  a.duration = Math.round((Date.now() - a.startedAt) / 60000);
  a.feedback = fb;
  a.updatedAt = Date.now();
  a.entries = a.entries.map(function(e){
    return { exId:e.exId, name:e.name, muscle:e.muscle, secondary:e.secondary,
             range:e.range, sets:e.sets.filter(function(s){ return s.done; }) };
  }).filter(function(e){ return e.sets.length > 0; });

  if(a.entries.length){
    S.sessions.unshift(a);
    S.sessions.sort(function(x,y){ return x.date < y.date ? 1 : -1; });
    dirtySessions.add(a.id);
    applyFeedback(fb);
    advanceCursor();
  }
  S.ui.active = null;
  clearInterval(elapsedTimer); clearInterval(restTimer);
  keepAwake(false);
  save({config:true});
  closeSheet();
  render();
  toast(a.entries.length ? 'Session logged · next up ' + curDay().name : 'Nothing logged');
}

/* ---------- 16. Events --------------------------------------------------- */

document.addEventListener('click', function(ev){
  const t = ev.target.closest('[data-act],[data-tab],[data-cat],[data-range],[data-open],[data-fb],[data-pick],[data-day],[data-sheet-bg]');
  if(!t) return;

  if(t.hasAttribute('data-sheet-bg')){
    if(ev.target === t){ closeSheet(); }
    return;
  }
  if(t.dataset.tab){ S.ui.tab = t.dataset.tab; save(); render(); return; }
  if(t.dataset.cat){ S.ui.feedCat = t.dataset.cat; render(); return; }
  if(t.dataset.range !== undefined){ S.ui.chartRange = +t.dataset.range; render(); return; }
  if(t.dataset.open){
    S.ui.open = S.ui.open || {};
    S.ui.open[t.dataset.open] = !S.ui.open[t.dataset.open];
    render(); return;
  }
  if(t.dataset.fb){
    fbState[t.dataset.fb][t.dataset.k] = parseInt(t.dataset.v, 10);
    drawFeedback(Object.keys(fbState)); return;
  }
  if(t.dataset.pick){
    const d = S.program.days[parseInt(t.dataset.d, 10)];
    d.exercises.push(mkEx(t.dataset.pick, 3));
    S.ui.pickQ = '';
    save({config:true}); closeSheet(); render();
    toast(t.dataset.pick + ' added'); return;
  }
  if(t.dataset.day !== undefined && t.dataset.act === undefined){
    S.meso.cursor.day = parseInt(t.dataset.day, 10);
    save({config:true}); closeSheet(); render(); return;
  }

  const a = t.dataset.act;
  const setRow = t.closest('.set-row');

  switch(a){
    case 'start': startSession(); window.scrollTo(0,0); break;
    case 'quit':
      if(confirm('Close without saving this session?')){
        S.ui.active = null; clearInterval(elapsedTimer); clearInterval(restTimer);
        keepAwake(false); save(); render();
      }
      break;
    case 'finish': finishSession(); break;
    case 'fb-save': commitSession(fbState); break;
    case 'fb-skip': commitSession({}); break;
    case 'skip': advanceCursor(); save({config:true}); render(); break;
    case 'pickday': openDayPicker(); break;

    case 'w-': case 'w+': {
      const e = S.ui.active.entries[+setRow.dataset.ex];
      const st = e.sets[+setRow.dataset.set];
      const lib = LIB_BY_NAME[e.name];
      const step = inc({load: lib ? lib.load : 'upper'});
      st.w = Math.max(0, roundLoad(st.w + (a === 'w+' ? step : -step)));
      refreshRow(setRow, st); save(); break;
    }
    case 'r-': case 'r+': {
      const e = S.ui.active.entries[+setRow.dataset.ex];
      const st = e.sets[+setRow.dataset.set];
      st.reps = Math.max(0, st.reps + (a === 'r+' ? 1 : -1));
      refreshRow(setRow, st); save(); break;
    }
    case 'log': {
      const e = S.ui.active.entries[+setRow.dataset.ex];
      const st = e.sets[+setRow.dataset.set];
      st.done = !st.done;
      setRow.classList.toggle('logged', st.done);
      const card = document.getElementById('exc' + setRow.dataset.ex);
      if(card) card.classList.toggle('done', e.sets.every(function(x){ return x.done; }));
      if(st.done){
        startRest(S.settings.rest);
        if(navigator.vibrate) navigator.vibrate(18);
        const tk = t.closest('.tick');
        if(tk){ tk.classList.remove('just'); void tk.offsetWidth; tk.classList.add('just'); }
        if(e.sets.every(function(x){ return x.done; })) scrollToNext(+setRow.dataset.ex);
      }
      updateSessHead(); save(); break;
    }
    case 'addset': {
      const e = S.ui.active.entries[+t.dataset.ex];
      const last = e.sets[e.sets.length - 1] || { w:e.target || 0, reps:e.range[1], rir:e.rir };
      e.sets.push({ w:last.w, reps:last.reps, rir:last.rir, done:false });
      redrawCard(+t.dataset.ex); save(); break;
    }
    case 'dropset': {
      const e = S.ui.active.entries[+t.dataset.ex];
      if(e.sets.length > 1) e.sets.pop();
      redrawCard(+t.dataset.ex); save(); break;
    }
    case 'timer-toggle':
      if(restTimer){ clearInterval(restTimer); restTimer = null;
        document.getElementById('timerbar').classList.remove('live'); }
      else startRest(restLeft > 0 ? restLeft : S.settings.rest);
      break;
    case 'timer-plus': restLeft += 30; restTotal = Math.max(restTotal, restLeft); paintRest(); break;

    case 'sets-': case 'sets+': {
      const e = S.program.days[+t.dataset.d].exercises[+t.dataset.e];
      e.sets = clamp(e.sets + (a === 'sets+' ? 1 : -1), 1, 10);
      save({config:true}); render(); break;
    }
    case 'rmex': {
      const d = S.program.days[+t.dataset.d];
      d.exercises.splice(+t.dataset.e, 1);
      save({config:true}); render(); break;
    }
    case 'addex': openExPicker(+t.dataset.d); break;
    case 'meso-back':
      S.meso.cursor.day = Math.max(0, S.meso.cursor.day - 1);
      save({config:true}); render(); break;
    case 'meso-fwd': advanceCursor(); save({config:true}); render(); break;
    case 'units': S.settings.units = t.dataset.v; save({config:true}); render(); break;
    case 'autoreg': S.settings.autoreg = t.dataset.v === '1'; save({config:true}); render(); break;
    case 'dys': S.settings.dyslexic = t.dataset.v === '1'; save({config:true}); render(); break;
    case 'addbw': {
      const el = document.getElementById('bwin');
      const v = parseFloat(el && el.value);
      if(!v){ toast('Enter a number first'); break; }
      const d = new Date().toISOString().slice(0,10);
      S.bodyweight = S.bodyweight.filter(function(x){ return x.date !== d; });
      S.bodyweight.push({ date:d, kg:v });
      save({config:true}); render(); toast('Logged ' + v + ' ' + U()); break;
    }
    case 'export': doExport(); break;
    case 'import': doImport(); break;
    case 'reset':
      if(confirm('Erase all sessions, program edits and settings? This cannot be undone.')){
        S = defaultState();
        S.sessions = expandArchive();
        dirtySessions.clear(); configDirty = true;
        save({config:true}); render(); toast('Reset');
      }
      break;
  }
});

document.addEventListener('change', function(ev){
  const t = ev.target;
  const a = t.dataset.act;
  if(!a) return;
  const setRow = t.closest('.set-row');
  if(a === 'rir' && setRow){
    S.ui.active.entries[+setRow.dataset.ex].sets[+setRow.dataset.set].rir = parseInt(t.value, 10);
    save(); return;
  }
  if(a === 'w-set' && setRow){
    const st = S.ui.active.entries[+setRow.dataset.ex].sets[+setRow.dataset.set];
    st.w = Math.max(0, parseFloat(t.value) || 0); save(); return;
  }
  if(a === 'r-set' && setRow){
    const st = S.ui.active.entries[+setRow.dataset.ex].sets[+setRow.dataset.set];
    st.reps = Math.max(0, parseInt(t.value, 10) || 0); save(); return;
  }
  if(a === 'blockweeks'){
    blocks()[+t.dataset.i].weeks = clamp(parseInt(t.value, 10) || 1, 1, 8);
    if(S.meso.cursor.week > curBlock().weeks) S.meso.cursor.week = curBlock().weeks;
    save({config:true}); render(); return;
  }
  if(a === 'incUpper' || a === 'incLower' || a === 'rest'){
    S.settings[a] = Math.max(0.5, parseFloat(t.value) || S.settings[a]);
    save({config:true}); return;
  }
  if(t.id === 'chartex'){ S.ui.chartEx = t.value; render(); }
});
document.addEventListener('input', function(ev){
  if(ev.target.id === 'chartex'){ S.ui.chartEx = ev.target.value; render(); }
});

function refreshRow(row, st){
  const ins = row.querySelectorAll('input.val');
  if(ins[0]) ins[0].value = st.w;
  if(ins[1]) ins[1].value = st.reps;
}
function redrawCard(i){
  const card = document.getElementById('exc' + i);
  if(!card) return;
  const e = S.ui.active.entries[i];
  card.innerHTML = exCardInner(e, i);
  card.classList.toggle('done', e.sets.length > 0 && e.sets.every(function(x){ return x.done; }));
  updateSessHead();
}
/** When an exercise is finished, bring the next unfinished one into view. */
function scrollToNext(fromIdx){
  const ents = S.ui.active.entries;
  for(let i = fromIdx + 1; i < ents.length; i++){
    if(ents[i].sets.some(function(x){ return !x.done; })){
      const card = document.getElementById('exc' + i);
      if(card) setTimeout(function(){
        window.scrollTo({ top: card.getBoundingClientRect().top + window.scrollY - 132,
                          behavior:'smooth' });
      }, 420);
      return;
    }
  }
}
function updateSessHead(){
  const a = S.ui.active; if(!a) return;
  const logged = a.entries.reduce(function(n, e){
    return n + e.sets.filter(function(s){ return s.done; }).length; }, 0);
  const total = a.entries.reduce(function(n, e){ return n + e.sets.length; }, 0);
  const el = $('.sess-head .mono');
  if(el) el.innerHTML = PHASE[a.phase].label + ' · wk ' + a.week + ' · ' + logged + '/' + total +
    ' sets · <span id="elapsed">' + mmss((Date.now() - a.startedAt) / 1000) + '</span>';
}

/* ---------- 17. Export / import ------------------------------------------ */

function doExport(){
  const blob = JSON.stringify(S, null, 2);
  navigator.clipboard && navigator.clipboard.writeText(blob).then(function(){
    toast('Copied to clipboard');
  }).catch(function(){ showBlob(blob); });
  if(!navigator.clipboard) showBlob(blob);
}
function showBlob(blob){
  openSheet('<h2>Your data</h2><p class="sub">Select all and copy. Paste it into Import to restore.</p>' +
    '<textarea class="search" style="height:220px;font-family:var(--f-mono);font-size:11px" readonly>' +
    esc(blob) + '</textarea>');
}
function doImport(){
  openSheet('<h2>Import</h2><p class="sub">Paste a previously exported file. This replaces ' +
    'everything currently stored.</p>' +
    '<textarea class="search" id="impbox" style="height:200px;font-family:var(--f-mono);font-size:11px" ' +
    'placeholder="Paste JSON here"></textarea>' +
    '<button class="btn btn-primary btn-lg" id="impgo">Replace my data</button>');
  document.getElementById('impgo').addEventListener('click', function(){
    try {
      const p = JSON.parse(document.getElementById('impbox').value);
      if(!p || p.v !== 1) throw new Error('bad');
      S = p; migrate();
      S.sessions.forEach(function(s){ dirtySessions.add(s.id); });
      configDirty = true;
      save({config:true}); closeSheet(); render(); toast('Imported');
    } catch(e){ toast('That does not look like an export file'); }
  });
}

/* ---------- 18. Home-screen dressing ------------------------------------- */

function dressForHomeScreen(){
  // Skip entirely when the page already ships a real head (GitHub Pages build).
  if(document.querySelector('link[rel="manifest"]')) return;
  const add = function(name, content){
    const m = document.createElement('meta');
    m.setAttribute('name', name); m.setAttribute('content', content);
    document.head.appendChild(m);
  };
  add('apple-mobile-web-app-capable', 'yes');
  add('mobile-web-app-capable', 'yes');
  add('apple-mobile-web-app-title', 'Iron Ledger');
  add('apple-mobile-web-app-status-bar-style', 'black-translucent');
  add('theme-color', '#0A0A0B');
  const vp = document.querySelector('meta[name="viewport"]');
  if(vp) vp.setAttribute('content',
    'width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1');
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">' +
    '<rect width="180" height="180" rx="40" fill="#0A0A0B"/>' +
    '<g stroke="#FFE23D" stroke-width="13" stroke-linecap="round">' +
    '<path d="M42 90h96"/><path d="M42 66v48M138 66v48"/>' +
    '<path d="M26 76v28M154 76v28"/></g></svg>';
  const url = 'data:image/svg+xml;base64,' + btoa(svg);
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon'; link.href = url;
  document.head.appendChild(link);
}

/* ---------- 19. Boot ----------------------------------------------------- */

load();
dressForHomeScreen();
render();
initRemote();
if(S.ui.active) startElapsed();
window.addEventListener('beforeunload', function(){ try { pushRemote(); } catch(e){} });
</script>

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            try { toast('Update ready — close and reopen'); } catch(e){}
          }
        });
      });
    }).catch(function(){ /* offline install still works from cache */ });
  });
}
